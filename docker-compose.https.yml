version: "2.4"

# 公网 HTTPS（Let's Encrypt 自动申请与续期）
# 云主机：安全组放行 80/443，DuckDNS A 记录指向该机公网 IP。
#   docker-compose -f docker-compose.yml -f docker-compose.https.yml -f docker-compose.duckdns.yml up -d

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
